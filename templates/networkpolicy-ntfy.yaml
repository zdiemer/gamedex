{{- $sh := .Values.scraperHealth | default dict }}
{{- if and $sh.enabled ($sh.ntfy | default dict).enabled }}
# Additive exception to selfhosted's application-isolation egress policy, which
# only allows public addresses: ntfy is in-cluster (infra namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gamedex.fullname" . }}-ntfy-egress
  labels:
    {{- include "gamedex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gamedex.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ntfy
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
