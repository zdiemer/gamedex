apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gamedex.fullname" . }}
  labels:
    {{- include "gamedex.labels" . | nindent 4 }}
spec:
  # Recreate, not RollingUpdate. Surging to two pods used to be safe because
  # local-path pinned the volume to one node and RWO is *node*-scoped, so both
  # pods co-mounted it there. On truenas-iscsi RWO means single-node ATTACH: a
  # surge pod landing on another node blocks forever on FailedAttachVolume, and
  # the rollout deadlocks. Deploys now take a brief gap instead.
  #
  # Two PERMANENT replicas would still double the scrapers and refresh loops, so
  # replicas stays at 1 regardless.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gamedex.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Re-roll when the Dropbox URL secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "gamedex.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gamedex
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DROPBOX_XLSX_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: dropbox-url
            - name: DROPBOX_XLSX_FILENAME
              value: {{ .Values.dropbox.filename | quote }}
            - name: REFRESH_INTERVAL_SECONDS
              value: {{ .Values.refreshIntervalSeconds | quote }}
            # RomM: play emulated games in the browser. The credentials are a
            # read-only viewer account — gamedex only ever READS the rom list.
            - name: ROMM_URL
              value: {{ (.Values.romm | default dict).url | default "" | quote }}
            - name: ROMM_PUBLIC_URL
              value: {{ (.Values.romm | default dict).publicUrl | default "" | quote }}
            - name: ROMM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: romm-username
            - name: ROMM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: romm-password
            - name: NAS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: nas-token
            # Single-admin login. The account is seeded from these on first boot only;
            # changing them later does NOT reset the password (see values.yaml).
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: admin-username
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: admin-initial-password
            - name: ACCOUNTS_DB
              value: /data/accounts.sqlite
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: igdb-client-id
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: igdb-client-secret
            # ScreenScraper: real box scans for the Shelf. The developer pair is the
            # gate; without it the baked-in manifest is ignored and nothing changes.
            - name: SCREENSCRAPER_DEV_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: screenscraper-dev-id
            - name: SCREENSCRAPER_DEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: screenscraper-dev-password
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: screenscraper-user
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: screenscraper-password
            - name: SCREENSCRAPER_RATE
              value: {{ (.Values.screenscraper | default dict).rate | default 1 | quote }}
            - name: ENRICH_DB
              value: /data/enrichment.sqlite
            - name: ENRICH_BACKFILL
              value: {{ .Values.igdb.backfill | quote }}
            - name: CATALOGUE_DB
              value: /data/catalogue.sqlite
            - name: CATALOGUE_ENABLED
              value: {{ .Values.igdb.catalogue | quote }}
            - name: HLTB_ENABLED
              value: {{ .Values.igdb.hltb | quote }}
            - name: METACRITIC_ENABLED
              value: {{ .Values.igdb.metacritic | quote }}
            - name: FALLBACK_ENABLED
              value: {{ .Values.igdb.fallback | quote }}
            - name: GAMEEYE_ENABLED
              value: {{ .Values.igdb.gameye | quote }}
            - name: VALUE_RESCRAPE_DAYS
              value: {{ .Values.igdb.valueRescrapeDays | default 7 | quote }}
            - name: ARCADEDB_ENABLED
              value: {{ .Values.igdb.arcadedb | quote }}
            - name: VNDB_ENABLED
              value: {{ .Values.igdb.vndb | quote }}
            - name: THUMBY_ENABLED
              value: {{ .Values.igdb.thumby | quote }}
            - name: VGCHARTZ_ENABLED
              value: {{ .Values.igdb.vgchartz | quote }}
            - name: STEAMX_ENABLED
              value: {{ .Values.igdb.steamx | quote }}
            - name: SPEEDRUN_ENABLED
              value: {{ .Values.igdb.speedrun | quote }}
            - name: GUIDES_ENABLED
              value: {{ .Values.igdb.guides | quote }}
            - name: COOPTIMUS_ENABLED
              value: {{ .Values.igdb.cooptimus | quote }}
            - name: KHINSIDER_ENABLED
              value: {{ .Values.igdb.khinsider | quote }}
            # Translation Watch (src/translations.py). Off unless asked for: it is a new
            # outbound crawl against two volunteer-run community sites. No secrets —
            # both sources are unauthenticated.
            - name: TRANSLATIONS_ENABLED
              value: {{ (.Values.translations | default dict).enabled | default false | quote }}
            - name: TRANSLATIONS_DB
              value: /data/translations.sqlite
            - name: TRANSLATION_POLL_INTERVAL
              value: {{ (.Values.translations | default dict).pollInterval | default 21600 | quote }}
            - name: TRANSLATION_SOURCES
              value: {{ (.Values.translations | default dict).sources | default "rhdi,plaza" | quote }}
            - name: TRANSLATION_DETAIL_BUDGET
              value: {{ (.Values.translations | default dict).detailBudget | default 400 | quote }}
            - name: TRANSLATION_MATCH_BUDGET
              value: {{ (.Values.translations | default dict).matchBudget | default 60 | quote }}
            - name: TRANSLATIONS_NSFW
              value: {{ (.Values.translations | default dict).includeNsfw | default false | quote }}
            - name: GAMESPOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: gamespot-api-key
            - name: GAMESPOT_ENABLED
              value: {{ (.Values.gamespot | default dict).enabled | default false | quote }}
            - name: ITAD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: itad-api-key
            - name: ITAD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "gamedex.fullname" . }}
                  key: itad-client-id
            - name: ITAD_COUNTRY
              value: {{ (.Values.itad | default dict).country | default "US" | quote }}
            # Third-party asset caches on the PVC: images (covers/screenshots/art)
            # and the Internet Archive PDF manuals.
            - name: IMG_CACHE_ENABLED
              value: {{ (.Values.imageCache | default dict).enabled | default true | quote }}
            - name: IMG_CACHE_MAX_MB
              value: {{ (.Values.imageCache | default dict).maxMb | default 500 | quote }}
            - name: MANUAL_CACHE_ENABLED
              value: {{ (.Values.manualCache | default dict).enabled | default true | quote }}
            - name: MANUAL_CACHE_MAX_MB
              value: {{ (.Values.manualCache | default dict).maxMb | default 1024 | quote }}
          # Ready only once the first Dropbox load succeeds (health returns 503
          # until then), so traffic never hits an empty dataset.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Liveness hits a static asset so a transient Dropbox outage (which
            # keeps serving last-good data) doesn't trigger a pointless restart.
            httpGet:
              path: /style.css
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            # readOnlyRootFilesystem is on; give libraries a small writable
            # scratch dir. The games data itself stays in memory.
            - name: tmp
              mountPath: /tmp
            # Persistent state: the IGDB enrichment cache (SQLite), the shelf box
            # cuts, and the third-party image cache (/data/imgcache).
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "gamedex.fullname" . }}-data
