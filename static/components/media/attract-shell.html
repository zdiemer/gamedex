<div class="attract-overlay" id="attract-overlay" hidden>
    <div class="attract-progress"><i id="attractProgressFill"></i></div>
    <div class="attract-stages" id="attractStages"></div>
    <div class="attract-hint">Esc to exit · ← → to browse · click the cover for details</div>
    <div class="attract-controls">
      <button class="attract-btn" id="attractMute" aria-label="Unmute"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-muted"/></svg></button>
      <button class="attract-btn" id="attractPrev" aria-label="Previous">‹</button>
      <button class="attract-btn" id="attractNext" aria-label="Next">›</button>
      <button class="attract-btn" id="attractClose" aria-label="Exit attract mode"><svg class="ico" width="18" height="18" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
  </div>
