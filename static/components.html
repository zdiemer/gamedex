<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component library · Gamedex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components-gallery.css">
  <script defer src="core.js"></script>
  <script defer src="components.js"></script>
  <script defer src="enrich.js"></script>
  <script defer src="mine.js"></script>
  <script defer src="hero.js"></script>
  <script defer src="panels.js"></script>
  <script defer src="data.js"></script>
  <script defer src="launch.js"></script>
  <script defer src="table.js"></script>
  <script defer src="stats.js"></script>
  <script defer src="charts.js"></script>
  <script defer src="components-catalog.js"></script>
  <script defer src="components-gallery.js"></script>
</head>
<body class="library-page">
  <header class="library-header">
    <a href="index.html" class="brand-word">Game<span>dex</span></a>
    <span class="pill">Admin</span>
    <a href="index.html">Back to app</a>
    <button type="button" class="btn ghost" id="themeToggle" aria-pressed="false">Light theme</button>
  </header>
  <main class="library">
    <div class="library-intro"><p class="library-eyebrow">DESIGN &amp; DEVELOPMENT</p>
      <h1>Component library</h1>
      <p>The UI across Gamedex: controls, game tiles, drawers, media, account tools, and feature components. Reuse these implementations before adding another.</p>
      <p id="libraryCounts" class="muted" role="status"></p>
    </div>
    <div class="library-workbench">
      <aside class="library-browser" aria-label="Component catalogue">
        <label for="librarySearch">Find a component</label>
        <input type="search" id="librarySearch" placeholder="Search, avatar, drawer, toggle…" autocomplete="off">
        <label for="libraryCategory">Category</label>
        <select id="libraryCategory"><option value="">All components</option></select>
        <p id="resultCount" role="status" class="muted"></p>
        <nav id="componentList" aria-label="Components"></nav>
      </aside>
      <article class="library-detail" id="componentDetail" aria-labelledby="componentTitle">
        <p id="componentCategory" class="library-eyebrow"></p>
        <h2 id="componentTitle"></h2>
        <p id="componentDescription"></p>
        <p id="componentOwner"></p>
        <div class="library-actions" id="componentActions"></div>
        <div class="library-preview" id="componentPreview"></div>
        <p id="feedback" role="status" aria-live="polite"></p>
        <details class="library-source"><summary>Implementation and reuse</summary>
          <p id="componentUsage"></p><a id="componentFullSource" target="_blank" rel="noopener">Open full source ↗</a><p class="muted">Source excerpt (up to 100 lines)</p><pre><code id="componentSource"></code></pre>
        </details>
      </article>
    </div>
  </main>
</body>
</html>
